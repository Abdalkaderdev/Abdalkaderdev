name: Contribution snake

# Renders the contribution graph as an animated SVG and commits it to the
# `output` branch, which the README points at. Daily, plus on demand.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Two runs pushing to `output` at once lose the ref lock and one fails.
concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#f44e00&color_dots=#161310,#4a1d05,#8c3708,#d44400,#f44e00
            dist/snake-light.svg?palette=github-light&color_snake=#f44e00&color_dots=#ebedf0,#ffd3bf,#ff9d6e,#f96a1b,#f44e00

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
